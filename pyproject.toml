[project]
name = "testomation"
version = "0.0.1"
description = "Autonomous, local-first software testing: plans, writes and triages tests with local models."
readme = "README.md"
requires-python = ">=3.12,<3.14"
# Runtime dependencies are added phase by phase (see docs/ROADMAP.md).
# Never add the anthropic SDK or any paid API here — the product runs on Ollama only.
dependencies = []

[project.scripts]
testomation = "testomation.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testomation"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spike", "bench/app"]  # throwaway spike code; vendored benchmark app

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
