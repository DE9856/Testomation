# Seeded-bug catalogue (docs/EVALUATION.md). Each entry is switched on with
#   BUGS=<id> bench/app/conduit.sh reset
# kind = "bug"   → the app is broken; `catches` names the reference spec that must fail
# kind = "noise" → harmless console/network errors; every reference spec must still pass
# kind = "flaky" → intermittent slowness; measures how often specs fail without a bug
# held_out = true → never used for tuning prompts or thresholds (overfitting guard)

[[variant]]
id = "login-error-hidden"
kind = "bug"
category = "missing feedback"
catches = "ref02-wrong-password"
description = "Wrong password shows no error message"

